definitions:
  api.DeletePostsRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  api.PostRequest:
    properties:
      content:
        type: string
      images:
        items:
          $ref: '#/definitions/models.PostImage'
        type: array
      scheduled_at:
        type: string
    type: object
  api.TimezoneUpdateRequest:
    description: Request payload for updating timezone.
    properties:
      location:
        type: string
    type: object
  models.PostImage:
    properties:
      altText:
        type: string
      id:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/posts:
    delete:
      consumes:
      - application/json
      description: Delete multiple posts by their IDs
      parameters:
      - description: IDs to delete
        in: body
        name: ids
        required: true
        schema:
          $ref: '#/definitions/api.DeletePostsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, deleted_ids: []int, count: int, message:
            string }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Delete multiple posts
      tags:
      - posts
    get:
      description: Returns all scheduled posts, sorted by scheduled time
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: []models.Post }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: List all posts
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Schedule a new LinkedIn post
      parameters:
      - description: Post data
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/api.PostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: '{ success: true, data: models.Post }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Create a new post
      tags:
      - posts
  /api/v1/posts/{id}:
    delete:
      description: Delete a single post by its ID
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, deleted_id: int, message: string }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Delete a post
      tags:
      - posts
    get:
      description: Returns a single post by its ID
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: models.Post }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Get a post by ID
      tags:
      - posts
    put:
      consumes:
      - application/json
      description: Update the content, scheduled time, or images of a post
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Post data
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/api.PostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: models.Post }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Update a post
      tags:
      - posts
  /api/v1/posts/{id}/publish:
    post:
      description: Publish a single post to LinkedIn by its ID
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, published_id: int, message: string }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Publish a post
      tags:
      - posts
  /api/v1/posts/due:
    get:
      description: Returns posts that are ready to be published
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: []models.Post }'
          schema:
            additionalProperties: true
            type: object
      summary: Get due posts
      tags:
      - posts
  /api/v1/posts/image-url:
    get:
      description: Returns a direct download URL for a LinkedIn image asset by URN
      parameters:
      - description: LinkedIn image asset URN
        in: query
        name: urn
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, url: string }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Get LinkedIn image download URL
      tags:
      - posts
  /api/v1/posts/publish-due:
    post:
      description: Publish all posts that are due to be published
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, published: []int, failed: []int, message:
            string }'
          schema:
            additionalProperties: true
            type: object
      summary: Publish all due posts
      tags:
      - posts
  /api/v1/posts/upload-image:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image file to LinkedIn and returns the asset URN and
        alt text
      parameters:
      - description: Image file to upload
        in: formData
        name: image
        required: true
        type: file
      - description: Alt text for the image
        in: formData
        name: altText
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, urn: string, altText: string }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Upload an image to LinkedIn
      tags:
      - posts
  /api/v1/scheduler/start:
    post:
      description: Starts the auto-scheduler for publishing posts
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, message: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Start the scheduler
      tags:
      - scheduler
  /api/v1/scheduler/status:
    get:
      description: Returns the status and next run time of the auto-scheduler
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: SchedulerStatusResponse }'
          schema:
            additionalProperties: true
            type: object
      summary: Get scheduler status
      tags:
      - scheduler
  /api/v1/scheduler/stop:
    post:
      description: Stops the auto-scheduler for publishing posts
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, message: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Stop the scheduler
      tags:
      - scheduler
  /api/v1/timezone:
    get:
      description: Returns the current configured timezone
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: TimezoneResponse }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Get current timezone
      tags:
      - timezone
    post:
      consumes:
      - application/json
      description: Updates the configured timezone
      parameters:
      - description: Timezone data
        in: body
        name: timezone
        required: true
        schema:
          $ref: '#/definitions/api.TimezoneUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: TimezoneResponse, message: string }'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Update timezone
      tags:
      - timezone
  /auth/debug:
    get:
      description: Returns debug information and common issues for LinkedIn authentication
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, info: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, issues: []string }'
          schema:
            additionalProperties: true
            type: object
      summary: Debug LinkedIn authentication
      tags:
      - auth
  /auth/linkedin:
    get:
      description: Returns the LinkedIn OAuth URL for authentication
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, auth_url: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Get LinkedIn OAuth URL
      tags:
      - auth
  /auth/logout:
    post:
      description: Logs out the current user and removes the LinkedIn token
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, message: string }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: '{ success: false, error: string }'
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - auth
  /auth/status:
    get:
      description: Returns the current LinkedIn authentication status
      produces:
      - application/json
      responses:
        "200":
          description: '{ success: true, data: AuthStatusResponse }'
          schema:
            additionalProperties: true
            type: object
      summary: Get authentication status
      tags:
      - auth
swagger: "2.0"
